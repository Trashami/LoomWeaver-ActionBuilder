<section class="lw-party-card" aria-label="Party Snapshot">
  <header class="lw-party-card__head">
    <div class="lw-party-card__title">
      <lw-icon name="users" [size]="15" />
      <h3>{{ title() }}</h3>
    </div>
    <button
      ngpButton
      type="button"
      class="lw-party-card__add"
      title="Open Character Studio"
      (click)="addMemberRequested.emit()"
    >
      <lw-icon name="plus" [size]="14" />
    </button>
  </header>

  <div class="lw-party-card__list">
    @for (m of members(); track m.id) {
      <button
        ngpButton
        type="button"
        class="lw-party-row"
        [class.lw-party-row--selected]="selectedKey() === m.compositeKey"
        (click)="memberSelected.emit(m)"
      >
        <span
          class="lw-party-row__dot"
          [class.lw-party-row__dot--online]="m.online"
          aria-hidden="true"
        ></span>
        <span
          ngpAvatar
          class="lw-party-row__avatar"
          [style.border-color]="m.ringColor || '#49e892'"
        >
          <span ngpAvatarFallback>{{ m.avatarInitials }}</span>
        </span>
        <span class="lw-party-row__meta">
          <strong>{{ m.name }}</strong>
          <small>{{ m.classAndAncestry }}</small>
        </span>
        <span
          ngpProgress
          [ngpProgressValue]="m.hpCurrent"
          [ngpProgressMax]="m.hpMax"
          class="lw-party-row__hp"
        >
          <span class="lw-party-row__hp-label">
            {{ m.resourceLabel || ('HP ' + m.hpCurrent + '/' + m.hpMax) }}
          </span>
          <span ngpProgressTrack class="lw-party-row__hp-track">
            <span
              ngpProgressIndicator
              class="lw-party-row__hp-fill"
              [style.width.%]="hpPercent(m)"
            ></span>
          </span>
        </span>
      </button>
    }
  </div>

  @if (healthTitle()) {
    <footer class="lw-party-card__status-banner">
      <span class="lw-party-card__status-icon" aria-hidden="true">
        <lw-icon name="shield" [size]="15" />
      </span>
      <div class="lw-party-card__status-copy">
        <strong>{{ healthTitle() }}</strong>
        <span>{{ healthSubtitle() }}</span>
      </div>
    </footer>
  }
</section>
