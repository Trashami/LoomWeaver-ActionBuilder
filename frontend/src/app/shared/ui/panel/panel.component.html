<section
  class="lw-panel"
  [class.lw-panel--elevated]="elevated()"
  [class.lw-panel--padded]="padded()">
  @if (title() || eyebrow() || subtitle()) {
    <header class="lw-panel__header">
      <div class="lw-panel__heading">
        @if (eyebrow()) {
          <span class="lw-panel__eyebrow">{{ eyebrow() }}</span>
        }
        @if (title()) {
          <h3 class="lw-panel__title">
            @if (icon(); as iconName) {
              <lw-icon [name]="iconName" [size]="18" />
            }
            <span>{{ title() }}</span>
          </h3>
        }
        @if (subtitle()) {
          <p class="lw-panel__subtitle">{{ subtitle() }}</p>
        }
      </div>
      <div class="lw-panel__actions">
        <ng-content select="[panelActions]" />
      </div>
    </header>
  }
  <div class="lw-panel__body">
    <ng-content />
  </div>
</section>
