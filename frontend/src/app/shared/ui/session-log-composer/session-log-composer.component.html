<section class="lw-session-composer" aria-label="Session Log and Campaign Memory Composer">
  <header class="lw-session-composer__tabs-bar">
    <nav class="lw-session-composer__tabs" role="tablist">
      @for (tab of tabs; track tab.id) {
        <button
          type="button"
          role="tab"
          class="lw-session-composer__tab"
          [class.lw-session-composer__tab--active]="activeTab() === tab.id"
          [attr.aria-selected]="activeTab() === tab.id"
          (click)="selectTab(tab.id)">
          {{ tab.label }}
        </button>
      }
    </nav>

    <div class="lw-session-composer__filters">
      <button
        type="button"
        class="lw-session-composer__scope-pill"
        (click)="cycleScope()"
        title="Click to cycle note visibility scope">
        <lw-icon [name]="noteScope() === 'gm' ? 'eye-off' : noteScope() === 'private' ? 'shield' : 'users'" [size]="12" />
        <span>{{ noteScope() === 'gm' ? 'GM Only' : noteScope() === 'private' ? 'Private' : 'Shared with Party' }}</span>
      </button>

      <button type="button" class="lw-session-composer__date-pill">
        <span>{{ dateFilterLabel() }}</span>
        <lw-icon name="chevron-down" [size]="12" />
      </button>
    </div>
  </header>

  <div class="lw-session-composer__body">
    <div class="lw-session-composer__input-row">
      <input
        type="text"
        class="lw-session-composer__input"
        placeholder="Add a note, ruling, or moment... (Ctrl + Enter to save)"
        [ngModel]="draftText()"
        (ngModelChange)="draftText.set($event)"
        (keydown)="onKeyDown($event)" />
    </div>

    @if (entries().length > 0) {
      <div class="lw-session-composer__recent">
        @for (entry of entries().slice(0, 2); track entry.id) {
          <div class="lw-session-composer__entry">
            <span class="lw-session-composer__entry-time">{{ entry.timestamp }}</span>
            <span class="lw-session-composer__entry-scope" [attr.data-scope]="entry.scope">
              {{ entry.scope === 'gm' ? 'GM' : entry.scope === 'private' ? 'Private' : 'Party' }}
            </span>
            <span class="lw-session-composer__entry-text">{{ entry.text }}</span>
          </div>
        }
      </div>
    }

    <footer class="lw-session-composer__toolbar">
      <div class="lw-session-composer__format-tools">
        <button type="button" class="lw-session-composer__tool-btn" title="Bold" (click)="insertToken('**bold**')">
          <strong>B</strong>
        </button>
        <button type="button" class="lw-session-composer__tool-btn" title="Italic" (click)="insertToken('*italic*')">
          <em>I</em>
        </button>
        <button type="button" class="lw-session-composer__tool-btn" title="Bullet List" (click)="insertToken('• ')">
          <lw-icon name="scroll" [size]="13" />
        </button>
        <button type="button" class="lw-session-composer__tool-btn" title="Checklist Beat" (click)="insertToken('[ ] ')">
          <lw-icon name="check" [size]="13" />
        </button>
        <button type="button" class="lw-session-composer__tool-btn" title="Link Campaign Entity (@NPC, #Place)" (click)="insertToken('@Brother Malric')">
          <lw-icon name="link" [size]="13" />
        </button>
        <button type="button" class="lw-session-composer__tool-btn" title="Attach Handout or Scene Snapshot" (click)="insertToken('[Snapshot: Ruined Chapel]')">
          <lw-icon name="map" [size]="13" />
        </button>
        <button
          type="button"
          class="lw-session-composer__tool-btn lw-session-composer__tool-btn--accent"
          title="Index into The Loom Campaign Memory"
          (click)="loomFormatRequested.emit(draftText())">
          <lw-icon name="sparkles" [size]="13" />
        </button>
      </div>

      <div class="lw-session-composer__submit-group">
        <button type="button" class="lw-session-composer__save-btn" (click)="submitNote()">
          <span>Save to Campaign</span>
        </button>
        <button type="button" class="lw-session-composer__save-split" (click)="cycleScope()" title="Change Save Scope">
          <lw-icon name="chevron-down" [size]="13" />
        </button>
      </div>
    </footer>
  </div>
</section>
