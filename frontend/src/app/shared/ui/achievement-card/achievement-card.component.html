@let item = achievement();
<article class="lw-achievement-card" [class.lw-achievement-card--unlocked]="item.unlocked">
  <div class="lw-achievement-card__icon">
    <lw-icon [name]="item.icon" [size]="20" />
  </div>

  <div class="lw-achievement-card__body">
    <div class="lw-achievement-card__header">
      <div>
        <span class="lw-achievement-card__category">{{ item.category }} · {{ item.awardedTo }}</span>
        <h4 class="lw-achievement-card__title">{{ item.title }}</h4>
      </div>
      <div class="lw-achievement-card__badges">
        <lw-badge [label]="item.rarity" [tone]="badgeTone()" />
        <lw-badge [label]="'+' + item.xpBonus + ' XP'" tone="emerald" />
      </div>
    </div>

    <p class="lw-achievement-card__desc">{{ item.description }}</p>

    <div class="lw-achievement-card__progress">
      <div class="lw-achievement-card__progress-bar">
        <div
          class="lw-achievement-card__progress-fill"
          [style.width.%]="progressPercent()"
        ></div>
      </div>
      <span class="lw-achievement-card__progress-label">
        {{ item.unlocked ? 'Unlocked' : item.currentValue + ' / ' + item.targetValue }}
      </span>
    </div>
  </div>
</article>
