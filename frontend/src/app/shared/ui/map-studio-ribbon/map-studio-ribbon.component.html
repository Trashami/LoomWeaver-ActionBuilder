<div class="lw-studio-ribbon">
  <div class="lw-studio-ribbon__row">
    <div class="lw-studio-ribbon__title-box">
      <lw-icon name="Map" [size]="16" />
      <input
        type="text"
        class="lw-studio-ribbon__title-input"
        [ngModel]="mapTitle()"
        (ngModelChange)="titleChanged.emit($event)"
        aria-label="Active Map Title"
      />
      <lw-badge
        [label]="mapScope() === 'world_map' ? 'World Cartography' : 'Tactical Battlemap'"
        tone="gold"
      />
    </div>

    <div class="lw-studio-ribbon__scope-pills">
      <button
        type="button"
        class="lw-ribbon-pill"
        [class.lw-ribbon-pill--active]="mapScope() === 'battlemap'"
        (click)="scopeChanged.emit('battlemap')"
      >
        Battlemap Studio
      </button>
      <button
        type="button"
        class="lw-ribbon-pill"
        [class.lw-ribbon-pill--active]="mapScope() === 'world_map'"
        (click)="scopeChanged.emit('world_map')"
      >
        World Atlas Studio
      </button>
    </div>

    <div class="lw-studio-ribbon__actions">
      <lw-button variant="ghost" size="sm" icon="Layers" (pressed)="openCatalogRequested.emit()">
        Presets & Asset Library
      </lw-button>
      <lw-button
        variant="primary"
        size="sm"
        icon="Sparkles"
        [disabled]="saving()"
        (pressed)="saveRevisionRequested.emit()"
      >
        {{ saving() ? 'Committing Revision...' : 'Save Scene Revision' }}
      </lw-button>
    </div>
  </div>

  <div class="lw-studio-ribbon__row lw-studio-ribbon__row--sub">
    <div class="lw-studio-ribbon__group">
      <span class="lw-studio-ribbon__label">History</span>
      <button
        type="button"
        class="lw-ribbon-btn"
        [disabled]="!canUndo()"
        (click)="undoRequested.emit()"
      >
        Undo ({{ undoCount() }})
      </button>
      <button
        type="button"
        class="lw-ribbon-btn"
        [disabled]="!canRedo()"
        (click)="redoRequested.emit()"
      >
        Redo ({{ redoCount() }})
      </button>
      <span class="lw-studio-ribbon__history-note">{{ lastHistoryLabel() }}</span>
    </div>

    <div class="lw-studio-ribbon__group">
      <span class="lw-studio-ribbon__label">Floors / Levels</span>
      @for (lvl of levels(); track lvl.id) {
        <button
          type="button"
          class="lw-ribbon-pill"
          [class.lw-ribbon-pill--active]="activeLevelIndex() === lvl.levelIndex"
          (click)="levelSelected.emit(lvl.levelIndex)"
          [title]="lvl.name + ' (' + lvl.elevationMinFt + 'ft to ' + lvl.elevationMaxFt + 'ft)'"
        >
          L{{ lvl.levelIndex }}
        </button>
      }
      <button
        type="button"
        class="lw-ribbon-btn"
        (click)="addLevelRequested.emit()"
        title="Add Upper Floor Level"
      >
        + Level
      </button>
      <button
        type="button"
        class="lw-ribbon-pill"
        [class.lw-ribbon-pill--active]="ghostLowerFloors()"
        (click)="ghostModeToggled.emit()"
        title="Ghost Lower Floors at 22% opacity for floorplan alignment"
      >
        Ghost Lower (22%)
      </button>
      <button
        type="button"
        class="lw-ribbon-pill"
        [class.lw-ribbon-pill--active]="testTokenSandbox()"
        (click)="testTokenToggled.emit()"
        title="Drop a Test Token to preview tree canopy and roof fade occlusion"
      >
        Test Token Occlusion
      </button>
    </div>

    <div class="lw-studio-ribbon__group">
      <span class="lw-studio-ribbon__label">Viewport</span>
      <button
        type="button"
        class="lw-ribbon-pill"
        [class.lw-ribbon-pill--active]="renderMode() === '2D Blueprint'"
        (click)="renderModeChanged.emit('2D Blueprint')"
      >
        2D Canvas
      </button>
      <button
        type="button"
        class="lw-ribbon-pill"
        [class.lw-ribbon-pill--active]="renderMode() === 'Linked 2D <-> 3D'"
        (click)="renderModeChanged.emit('Linked 2D <-> 3D')"
      >
        2D + 3D Linked
      </button>
      <button
        type="button"
        class="lw-ribbon-pill"
        [class.lw-ribbon-pill--active]="renderMode() === '3D Tabletop'"
        (click)="renderModeChanged.emit('3D Tabletop')"
      >
        3D Builder
      </button>
    </div>
  </div>
</div>
