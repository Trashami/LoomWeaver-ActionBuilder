@if (variant() === 'public') {
  <header class="lw-public-topbar">
    <a class="lw-topbar__brand-tile" routerLink="/" href="/" aria-label="LoomWeaver home">
      <img class="lw-topbar__logo" [src]="logoSrc()" alt="LoomWeaver" width="136" height="42" />
      <span class="lw-topbar__titles">
        <span class="lw-topbar__name">LoomWeaver</span>
        <span class="lw-topbar__tag">Your Campaign. One Living World.</span>
      </span>
    </a>
    <div class="lw-public-topbar__navigation"><ng-content select="[public-navigation]" /></div>
    <div class="lw-public-topbar__actions"><ng-content select="[public-actions]" /></div>
  </header>
} @else {
<header
  class="lw-topbar"
  role="banner"
  [style.width]="width()"
  [style.min-width]="minWidth()"
  [style.max-width]="maxWidth()"
  [style.min-height]="minHeight()"
>
  <div class="lw-topbar__left">
    <button
      ngpButton
      type="button"
      class="lw-topbar__square-btn lw-topbar__nav-toggle"
      [class.lw-topbar__square-btn--active]="!navCollapsed()"
      [attr.aria-expanded]="!navCollapsed()"
      aria-label="Toggle Left Navigation Menu"
      title="Collapse or Expand Navigation Menu"
      (click)="navToggleRequested.emit()"
    >
      <lw-icon [name]="collapseIcon()" [size]="20" />
    </button>

    <a class="lw-topbar__brand-tile" routerLink="/home">
      <img
        [src]="logoSrc()"
        [alt]="logoAlt()"
        class="lw-topbar__logo"
        [class.lw-topbar__logo--bordered]="logoShowBorder()"
        [style.border]="logoShowBorder() ? logoBorder() : 'none'"
        [style.width]="logoWidth()"
        [style.min-width]="logoMinWidth()"
        [style.max-width]="logoMaxWidth()"
        [style.height]="logoHeight()"
        [style.min-height]="logoMinHeight()"
        [style.max-height]="logoMaxHeight()"
      />
      <div class="lw-topbar__titles">
        <span class="lw-topbar__tag">Your Campaign. One Living World.</span>
      </div>
    </a>

    <!-- Campaign Selector via Reusable Core Context Switcher -->
    <lw-context-switcher
      [kicker]="'CAMPAIGN · ' + (isCampaignGm() ? 'DM / GM' : 'PLAYER')"
      [title]="activeCampaign()?.name || 'Shadow of the Mountain'"
      tone="gold"
      panelTitle="SWITCH ACTIVE CAMPAIGN"
      [countLabel]="campaignCountLabel()"
      ariaLabel="Select Active Campaign"
      [options]="campaignSwitcherOptions()"
      [footerActions]="campaignFooterActions"
      [open]="campaignDropdownOpen()"
      (openChange)="onCampaignOpenChange($event)"
      (optionSelected)="onCampaignOptionSelected($event)"
      (actionSelected)="onCampaignActionSelected($event)"
    />

    <!-- Current Session Selector via Reusable Core Context Switcher -->
    @if (store) {
      <lw-context-switcher
        [kicker]="'CURRENT SESSION (' + (store.activeSession()?.statusLabel || 'Current / Upcoming') + ')'"
        [title]="store.activeSession()?.title || 'Session 15 — The Ruined Chapel'"
        tone="emerald"
        panelTitle="SELECT PLANNING / PLAY SESSION"
        [countLabel]="sessionCountLabel()"
        ariaLabel="Select Current Session"
        [options]="sessionSwitcherOptions()"
        [footerActions]="sessionFooterActions"
        [open]="sessionDropdownOpen()"
        (openChange)="onSessionOpenChange($event)"
        (optionSelected)="onSessionOptionSelected($event)"
        (actionSelected)="onSessionActionSelected($event)"
      />
    }
  </div>

  <div ngpToolbar class="lw-topbar__right" aria-label="Studio utility controls">
    <button
      ngpButton
      type="button"
      class="lw-topbar__square-btn"
      [class.lw-topbar__square-btn--active]="audioPlaying()"
      (click)="audioToggled.emit()"
      aria-label="Toggle Ambient Audio Engine"
      title="Toggle Ambient Audio Engine"
    >
      <lw-icon name="music" [size]="18" />
    </button>

    <button
      ngpButton
      type="button"
      class="lw-topbar__square-btn"
      (click)="quickRollRequested.emit()"
      [attr.aria-label]="quickRollBanner()"
      [title]="quickRollBanner()"
    >
      <lw-icon name="dices" [size]="18" />
    </button>

    @if (store) {
      <button
        ngpButton
        type="button"
        class="lw-topbar__rect-btn lw-topbar__rect-btn--emerald"
        (click)="store.openAdventureGuideModal('session')"
        title="Open Adventure & Session Guide (Current Session or Whole Guide)"
      >
        <span>Adventure Guide</span>
      </button>
    }

    <button
      ngpButton
      type="button"
      class="lw-topbar__rect-btn lw-topbar__rect-btn--gold"
      [disabled]="!isCampaignGm()"
      (click)="isCampaignGm() && viewerRoleToggled.emit()"
      [title]="isCampaignGm() ? 'Switch between GM View and Player View for your campaign' : 'You are a Player in this campaign (Player View enforced)'"
    >
      <span>{{ isCampaignGm() ? (viewerRole() === 'gm' ? 'GM View' : 'Player View') : 'Player View' }}</span>
    </button>

    <button
      ngpButton
      type="button"
      class="lw-topbar__rect-btn lw-topbar__loom-trigger"
      [class.lw-topbar__square-btn--active]="loomOpen()"
      [attr.aria-expanded]="loomOpen()"
      aria-haspopup="dialog"
      (click)="loomToggled.emit()"
      title="Ask The Loom · Living Campaign Memory Assistant (Ctrl + K)"
    >
      <span>The Loom</span>
      <span class="lw-topbar__kbd" aria-hidden="true">Ctrl + K</span>
    </button>

    <a
      ngpButton
      class="lw-topbar__rect-btn"
      routerLink="/welcome"
      title="View Public Marketing Site"
    >
      <span>Site</span>
    </a>

    <lw-user-menu
      [userDisplayName]="userDisplayName()"
      [userEmail]="userEmail()"
      [userTierCode]="userTierCode()"
      [viewerRole]="viewerRole()"
      [generativeAiEnabled]="generativeAiEnabled()"
      [hideAiContent]="hideAiContent()"
      [experienceMode]="experienceMode()"
      (generativeAiToggled)="generativeAiToggled.emit($event)"
      (hideAiContentToggled)="hideAiContentToggled.emit($event)"
      (experienceModeChanged)="experienceModeChanged.emit($event)"
      (viewerRoleToggled)="viewerRoleToggled.emit()"
      (syncProfileRequested)="syncProfileRequested.emit()"
      (logoutRequested)="logoutRequested.emit()"
    />
  </div>
</header>
}
