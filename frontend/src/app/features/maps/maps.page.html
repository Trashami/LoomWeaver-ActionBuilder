<div class="lw-maps-studio">
  <lw-map-studio-subbar
    [mapTitle]="mapTitle()"
    [gridCols]="50"
    [gridRows]="50"
    [gridCellFeet]="5"
    [revision]="sceneGraph().revision"
    [activeMode]="studioMode()"
    [canUndo]="history.canUndo()"
    [canRedo]="history.canRedo()"
    [viewerRole]="store.viewerRole()"
    (titleChanged)="mapTitle.set($event)"
    (modeChanged)="studioMode.set($event)"
    (undoRequested)="undoLastCommand()"
    (redoRequested)="redoLastCommand()"
    (saveRequested)="saveSceneRevision()"
  />

  <div class="lw-maps-studio__workbench">
    <lw-map-tool-dock
      [activeToolId]="activeDockToolId()"
      (toolSelected)="onDockToolSelected($event)"
    />

    <section class="lw-maps-studio__stage-column" aria-label="Interactive 2D/3D Map Viewport">
      <div
        class="lw-maps-studio__viewport-wrap"
        [class.lw-maps-studio__viewport-wrap--split]="cameraView() === 'split-2d-3d'"
      >
        <div
          class="lw-maps-studio__canvas-pane"
          [class.lw-maps-studio__canvas-pane--hidden]="!show3dCanvas()"
        >
          <canvas
            #babylonCanvas
            class="lw-maps-studio__canvas"
            aria-label="Babylon.js 3D Tactical Scene Canvas"
          ></canvas>
          <div class="lw-maps-studio__pane-tag">
            <span>Babylon.js 3D · {{ activeQuality() }} · Rev {{ sceneGraph().revision }}</span>
          </div>
        </div>

        <div
          class="lw-maps-studio__canvas-pane lw-maps-studio__canvas-pane--2d"
          [class.lw-maps-studio__canvas-pane--hidden]="!show2dCanvas()"
        >
          <canvas
            #real2dCanvas
            width="960"
            height="620"
            class="lw-maps-studio__canvas"
            aria-label="Authoritative Real 2D Tactical Canvas"
            (click)="on2dCanvasClick($event)"
          ></canvas>
          <div class="lw-maps-studio__pane-tag">
            <span>Real 2D Canvas Renderer · Instant 2D &lt;-&gt; 3D Sync</span>
          </div>
        </div>

        <div class="lw-maps-studio__hud-top-left">
          <span class="lw-maps-studio__hud-pill">
            Tool: <strong>{{ activeDockToolId().toUpperCase() }}</strong>
          </span>
          <span class="lw-maps-studio__hud-pill">
            Coords: <strong>({{ stage.lastPickedCoords().x }}, {{ stage.lastPickedCoords().z }})</strong>
          </span>
          <span class="lw-maps-studio__hud-pill">
            Instances: <strong>{{ stage.activeInstanceCount() }}</strong>
          </span>
        </div>

        <div class="lw-maps-studio__compass" aria-label="Scene Compass">
          <span class="lw-maps-studio__compass-dir lw-maps-studio__compass-dir--n">N</span>
          <span class="lw-maps-studio__compass-dir lw-maps-studio__compass-dir--e">E</span>
          <span class="lw-maps-studio__compass-dir lw-maps-studio__compass-dir--s">S</span>
          <span class="lw-maps-studio__compass-dir lw-maps-studio__compass-dir--w">W</span>
          <div class="lw-maps-studio__compass-needle"></div>
        </div>
      </div>

      <lw-map-viewport-bar
        [activeView]="cameraView()"
        [activeTheme]="activeTheme()"
        [activeQuality]="activeQuality()"
        [gridSize]="gridSizeLabel()"
        [snapEnabled]="snapEnabled()"
        [showPlayerSafeOnly]="showPlayerSafeOnly()"
        [fps]="stage.fps()"
        (viewChange)="onCameraViewChange($event)"
        (themeChange)="onThemeChange($event)"
        (qualityChange)="onQualityChange($event)"
        (gridSizeChange)="gridSizeLabel.set($event)"
        (snapToggle)="snapEnabled.set(!snapEnabled())"
        (playerSafeToggle)="onTogglePlayerSafeView()"
      />
    </section>

    <aside class="lw-maps-studio__right-dock" aria-label="Asset Library & Object Properties">
      <lw-map-png-asset-browser
        [assets]="pngAssets()"
        [selectedAssetId]="selectedPngAssetId()"
        [materials]="materials()"
        [selectedMaterialId]="selectedNode().materialId"
        [layers]="editorLayers()"
        [activeTheme]="activeTheme()"
        [batchBusy]="batchBusy()"
        [statusBanner]="pngPipelineBanner()"
        (assetSelect)="onSelectPngAsset($event)"
        (assetPlaceInScene)="onPlacePngAssetInScene($event)"
        (materialSelect)="onInspectorMaterialChange($event.id)"
        (themeSelect)="onThemeChange($event)"
        (layerToggleVisible)="onLayerToggleVisible($event)"
        (layerToggleSecret)="onLayerToggleSecret($event)"
        (triggerBatchRender)="triggerPythonBatchPngSync()"
        (uploadSingleGlb)="onUploadSingleGlb($event)"
      />

      <lw-map-properties-inspector
        [selectedNode]="selectedNode()"
        [materials]="materials()"
        [scatterDensity]="scatterDensity()"
        [waterFlowSpeed]="waterFlowSpeed()"
        [torchIntensity]="torchIntensity()"
        (materialChange)="onInspectorMaterialChange($event)"
        (heightSquaresChange)="onInspectorHeightChange($event)"
        (thicknessChange)="onInspectorThicknessChange($event)"
        (rotationChange)="onInspectorRotationChange($event)"
        (scaleChange)="onInspectorScaleChange($event)"
        (secretToggle)="onInspectorSecretToggle()"
        (applyToSimilar)="onApplyToSimilarWalls()"
        (scatterDensityChange)="scatterDensity.set($event)"
        (waterFlowChange)="waterFlowSpeed.set($event)"
        (torchIntensityChange)="torchIntensity.set($event)"
      />
    </aside>
  </div>
</div>
