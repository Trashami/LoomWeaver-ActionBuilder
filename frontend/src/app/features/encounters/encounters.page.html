<div class="lw-page">
  <lw-panel
    eyebrow="Module 3 · Encounter Authoring & Threat Budgeting"
    title="Encounter Builder & Bestiary Roster"
    subtitle="Compose balanced encounters, spawn creatures directly onto the Babylon.js VTT stage, and automate XP rewards upon completion."
    icon="swords"
    [elevated]="true">
    <div panelActions>
      <a class="lw-action-link" routerLink="/arcane-screen">Open Live Arcane Screen</a>
      <a class="lw-action-link" routerLink="/maps">Bind Scene in LoomMaps</a>
      <a class="lw-action-link" routerLink="/effects">Open Action & Effect Builder</a>
    </div>

    <div class="lw-encounter-grid">
      @for (enc of vtt.encounters(); track enc.id) {
        <lw-encounter-card
          [encounter]="enc"
          [active]="vtt.activeEncounterId() === enc.id"
          (encounterSelected)="store.inspectEntity(enc.compositeKey)"
          (startRequested)="launchEncounter($event)" />
      }
    </div>
  </lw-panel>

  <lw-panel
    eyebrow="Reusable lw-creature-card Component"
    title="Adversary & Boss Statblocks"
    subtitle="Click Spawn into VTT on any creature to place its token into the active Arcane Screen combat session."
    icon="shield">
    <div class="lw-card-grid">
      @for (creature of vtt.creatures(); track creature.id) {
        <lw-creature-card
          [creature]="creature"
          mode="detailed"
          (creatureSelected)="store.inspectEntity('1:Encounter:enc-cinth-vampires')"
          (spawnRequested)="spawnCreatureAndOpenVtt($event)" />
      }
    </div>
  </lw-panel>

  <lw-panel
    eyebrow="Reusable lw-npc-card Component"
    title="Key Scene NPCs & Role-Isolated Secrets"
    subtitle="GM secret fields are only rendered when GM View is active in the top bar."
    icon="users">
    <div panelActions>
      <lw-badge
        [label]="store.viewerRole() === 'gm' ? 'GM Secrets Visible' : 'Player-Safe View'"
        [tone]="store.viewerRole() === 'gm' ? 'gm' : 'emerald'" />
    </div>
    <div class="lw-card-grid">
      @for (npc of vtt.npcs(); track npc.compositeKey) {
        <lw-npc-card
          [npc]="npc"
          variant="detailed"
          [showGmSecret]="store.viewerRole() === 'gm'"
          (npcSelected)="store.inspectEntity($event.compositeKey)"
          (spawnRequested)="openArcaneScreen()" />
      }
    </div>
  </lw-panel>
</div>
