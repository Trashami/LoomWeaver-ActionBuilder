<div class="lw-page">
  <lw-panel
    eyebrow="Campaign Command"
    [title]="store.activeCampaign().name"
    [subtitle]="store.activeCampaign().subtitle + ' · World of ' + store.activeCampaign().worldName"
    icon="flag"
    [elevated]="true">
    <div panelActions>
      <a class="lw-action-link" routerLink="/arcane-screen">Open Live Arcane Screen</a>
      <a class="lw-action-link" routerLink="/maps">Open Map Studio</a>
      <lw-button variant="secondary" size="sm" icon="book-open" (pressed)="store.toggleLoomDrawer(true)">
        Search Canon in The Loom
      </lw-button>
    </div>

    <div class="lw-campaign-switcher">
      @for (camp of store.campaigns(); track camp.id) {
        <button
          type="button"
          class="lw-campaign-pill"
          [class.lw-campaign-pill--active]="camp.id === store.activeCampaignId()"
          (click)="store.setCampaign(camp.id)">
          <div class="lw-campaign-pill__top">
            <strong>{{ camp.name }}</strong>
            <lw-badge [label]="camp.systemLabel" tone="gold" />
          </div>
          <span>{{ camp.currentAct }} · Session {{ camp.currentSessionNumber }} · {{ camp.currentLocationName }}</span>
        </button>
      }
    </div>
  </lw-panel>

  <lw-panel
    eyebrow="Canon & World Registry"
    title="Quests, NPCs, Locations, Factions, Clues & Secrets"
    subtitle="Filtered automatically by your active role preview (GM sees Secret nodes; Players see Player-Safe Canon)."
    icon="compass">
    <div panelActions>
      <div class="lw-filter-bar">
        @for (cat of categories; track cat) {
          <lw-button
            [variant]="selectedCategory() === cat ? 'primary' : 'secondary'"
            size="sm"
            (pressed)="selectedCategory.set(cat)">
            {{ cat }}
          </lw-button>
        }
      </div>
    </div>

    <div class="lw-entity-grid">
      @for (entity of filteredEntities(); track entity.compositeKey) {
        <lw-entity-card
          [entity]="entity"
          variant="detailed"
          [active]="store.inspectedEntityKey() === entity.compositeKey"
          [canApprove]="store.viewerRole() === 'gm'"
          (inspectRequested)="store.inspectEntity($event.compositeKey)"
          (approveRequested)="store.approveDraftEntity($event.compositeKey)" />
      } @empty {
        <lw-empty-state
          icon="lock"
          title="No Entities Visible for Filter"
          description="Switch to GM Role Preview in the top bar to inspect GM-scoped Secret entities or choose another category."
          actionLabel="Reset Filter"
          (actionTriggered)="selectedCategory.set('All')" />
      }
    </div>
  </lw-panel>
</div>
