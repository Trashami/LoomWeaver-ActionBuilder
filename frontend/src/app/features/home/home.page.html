<div class="lw-dashboard">
  <!-- Top Tactical Live Session VTT Stage Web Component -->
  <lw-tactical-stage-card
    sceneName="Ruined Chapel"
    modeLabel="Encounter"
    mapImageUrl="/landing-assets/engines/engine-1-vtt-combat.jpg"
    [combatants]="combatants()"
    (tokenSelected)="onTokenSelected($event)"
    (rollDiceRequested)="store.rollGlobalQuickD20()"
    (expandRequested)="openFullVtt()"
  />

  <!-- Middle 3-Column Tactical Campaign Row Using Shared Web Components -->
  <section class="lw-dashboard__cards-grid" aria-label="Active Quests, Party Members, and Nearby NPCs">
    <!-- Column 1: Active Quests -->
    <article class="lw-dash-card">
      <header class="lw-dash-card__header">
        <h2 class="lw-dash-card__title">Active Quests</h2>
        <div class="lw-dash-card__actions">
          <a
            ngpButton
            routerLink="/campaigns"
            class="lw-dash-card__icon-btn"
            title="Add or Manage Quests"
          >
            <lw-icon name="plus" [size]="15" />
          </a>
        </div>
      </header>

      <div class="lw-dash-card__list">
        @for (quest of activeQuests(); track quest.id) {
          <lw-quest-tracker-card
            [quest]="quest"
            variant="compact-row"
            [selected]="selectedQuestId() === quest.id"
            (questSelected)="onQuestSelected($event)"
          />
        }
      </div>
    </article>

    <!-- Column 2: Party Members (Reusable LwPartyRosterCardComponent) -->
    <lw-party-roster-card
      [members]="partyMembers()"
      [selectedKey]="store.inspectedEntityKey() ?? ''"
      (memberSelected)="onMemberSelected($event)"
      (addMemberRequested)="openFullVtt()"
    />

    <!-- Column 3: Nearby NPCs -->
    <article class="lw-dash-card">
      <header class="lw-dash-card__header">
        <h2 class="lw-dash-card__title">Nearby NPCs</h2>
        <div class="lw-dash-card__actions">
          <a
            ngpButton
            routerLink="/campaigns"
            class="lw-dash-card__icon-btn"
            title="Add or Inspect NPCs"
          >
            <lw-icon name="plus" [size]="15" />
          </a>
        </div>
      </header>

      <div class="lw-dash-card__list">
        @for (npc of nearbyNpcs(); track npc.compositeKey) {
          <lw-npc-card
            [npc]="npc"
            variant="dashboard-row"
            [showGmSecret]="store.viewerRole() === 'gm'"
            [selected]="store.inspectedEntityKey() === npc.compositeKey"
            (npcSelected)="onNpcSelected($event)"
          />
        }
      </div>
    </article>
  </section>

  <!-- Bottom Session Log & Campaign Memory Composer Web Component -->
  <lw-session-log-composer
    dateFilterLabel="Today"
    [entries]="logEntries()"
    (noteSaved)="onSaveSessionNote($event)"
    (loomFormatRequested)="onAskLoomWithDraft($event)"
  />

  <!-- Optional Expandable Session Recaps & Studio Quick Links -->
  @if (sessions().length > 0) {
    <section class="lw-dashboard__chronicle-bar">
      <button
        ngpButton
        type="button"
        class="lw-dashboard__chronicle-toggle"
        (click)="showChronicleDrawer.set(!showChronicleDrawer())"
      >
        <span>Recent Session Recaps ({{ sessions().length }} archived in MySQL & Neo4j)</span>
        <lw-icon [name]="showChronicleDrawer() ? 'chevron-down' : 'chevron-right'" [size]="15" />
      </button>

      @if (showChronicleDrawer()) {
        <div class="lw-dashboard__chronicle-list">
          @for (sess of sessions(); track sess.id) {
            <lw-session-recap-card
              [session]="sess"
              (inspectEntityRequested)="store.inspectEntity($event)"
            />
          }
        </div>
      }
    </section>
  }
</div>
