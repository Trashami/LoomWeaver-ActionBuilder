<section class="ab-action-details" [class.ab-action-details--open]="expanded()">
  <button
    ngpButton
    type="button"
    class="ab-action-details__toggle"
    (click)="toggleExpanded()"
    [attr.aria-expanded]="expanded()"
  >
    <div class="ab-action-details__left">
      <lw-icon [name]="expanded() ? 'chevron-up' : 'chevron-down'" [size]="15" tone="muted" />
      <strong class="ab-action-details__title">Action details</strong>
      <span class="ab-action-details__sub">Name, cost, targeting &amp; range</span>
    </div>
    <span class="ab-action-details__summary">
      {{ rule().actionCost }} · {{ rule().targetLabel }} · {{ rule().rangeLabel }}
    </span>
  </button>

  @if (expanded()) {
    <div class="ab-action-details__body">
      <div class="ab-params-grid">
        <div class="ab-field ab-field--span2">
          <label class="ab-field__label">Name</label>
          <input
            ngpInput
            type="text"
            class="ab-field__input"
            [ngModel]="rule().name"
            (ngModelChange)="patchField('name', $event)"
          />
        </div>

        <div class="ab-field">
          <label class="ab-field__label">Category</label>
          <select
            class="ab-field__select"
            [ngModel]="rule().category"
            (ngModelChange)="patchField('category', $event)"
          >
            @for (cat of categories; track cat) {
              <option [value]="cat">{{ cat }}</option>
            }
          </select>
        </div>

        <div class="ab-field">
          <label class="ab-field__label">Action Cost</label>
          <select
            class="ab-field__select"
            [ngModel]="rule().actionCost"
            (ngModelChange)="patchField('actionCost', $event)"
          >
            @for (cost of actionCosts; track cost) {
              <option [value]="cost">{{ cost }}</option>
            }
          </select>
        </div>

        <div class="ab-field">
          <label class="ab-field__label">Range</label>
          <input
            ngpInput
            type="text"
            class="ab-field__input"
            [ngModel]="rule().rangeLabel"
            (ngModelChange)="patchField('rangeLabel', $event)"
          />
        </div>

        <div class="ab-field ab-field--span2">
          <label class="ab-field__label">Target</label>
          <input
            ngpInput
            type="text"
            class="ab-field__input"
            [ngModel]="rule().targetLabel"
            (ngModelChange)="patchField('targetLabel', $event)"
          />
        </div>

        <div class="ab-field">
          <label class="ab-field__label">Duration</label>
          <input
            ngpInput
            type="text"
            class="ab-field__input"
            [ngModel]="rule().durationLabel"
            (ngModelChange)="patchField('durationLabel', $event)"
          />
        </div>

        <div class="ab-field">
          <label class="ab-field__label">Base Formula</label>
          <input
            ngpInput
            type="text"
            class="ab-field__input"
            [ngModel]="rule().damageOrEffectFormula"
            (ngModelChange)="patchField('damageOrEffectFormula', $event)"
          />
        </div>

        <div class="ab-field">
          <label class="ab-field__label">Save DC (0 if None)</label>
          <input
            ngpInput
            type="number"
            class="ab-field__input"
            [ngModel]="rule().saveDc"
            (ngModelChange)="patchField('saveDc', +$event)"
          />
        </div>

        <div class="ab-field ab-field--full">
          <label class="ab-field__label">Summary</label>
          <textarea
            rows="2"
            class="ab-field__textarea"
            [ngModel]="rule().summary"
            (ngModelChange)="patchField('summary', $event)"
          ></textarea>
        </div>
      </div>
    </div>
  }
</section>
