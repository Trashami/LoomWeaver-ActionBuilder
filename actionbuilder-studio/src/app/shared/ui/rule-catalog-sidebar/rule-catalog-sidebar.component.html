<aside class="ab-sidebar">
  <div class="ab-sidebar__header">
    <div class="ab-sidebar__campaign-head">
      <span class="ab-sidebar__eyebrow">Engine &amp; Campaign Rules</span>
      <strong class="ab-sidebar__camp-name">{{ campaignName() }}</strong>
    </div>

    <div class="ab-sidebar__search">
      <lw-icon name="search" [size]="15" tone="muted" />
      <input
        ngpInput
        type="search"
        class="ab-sidebar__search-input"
        placeholder="Search 5e actions, reactions, spells..."
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQuery.set($event)"
        aria-label="Search actions"
      />
    </div>

    <div class="ab-sidebar__filters" role="tablist" aria-label="Source filter">
      <button
        ngpButton
        type="button"
        class="ab-sidebar__filter-btn"
        [class.ab-sidebar__filter-btn--active]="activeSourceFilter() === 'all'"
        (click)="activeSourceFilter.set('all')"
      >
        All ({{ allCount() }})
      </button>
      <button
        ngpButton
        type="button"
        class="ab-sidebar__filter-btn"
        [class.ab-sidebar__filter-btn--active]="activeSourceFilter() === 'custom'"
        (click)="activeSourceFilter.set('custom')"
      >
        Bypass ({{ customCount() }})
      </button>
      <button
        ngpButton
        type="button"
        class="ab-sidebar__filter-btn"
        [class.ab-sidebar__filter-btn--active]="activeSourceFilter() === 'srd'"
        (click)="activeSourceFilter.set('srd')"
      >
        Core ({{ coreCount() }})
      </button>
    </div>
  </div>

  <div class="ab-sidebar__list">
    @for (rule of filteredRules(); track rule.id) {
      <button
        ngpButton
        type="button"
        class="ab-rule-card"
        [class.ab-rule-card--active]="rule.id === selectedRuleId()"
        [class.ab-rule-card--modified]="rule.isCustomizedForCampaign"
        [class.ab-rule-card--bypassed]="!!rule.bypassedByRuleId"
        (click)="ruleSelected.emit(rule)"
      >
        <div class="ab-rule-card__avatar" [attr.data-custom]="rule.isCustomizedForCampaign">
          <span>{{ rule.name.slice(0, 2).toUpperCase() }}</span>
        </div>

        <div class="ab-rule-card__body">
          <div class="ab-rule-card__top">
            <strong class="ab-rule-card__name">{{ rule.name }}</strong>
            @if (hasDraft(rule.id)) {
              <lw-badge label="Draft" tone="gold" />
            } @else if (rule.bypassedByRuleId) {
              <lw-badge label="Bypassed" tone="gold" />
            } @else if (rule.bypassesCoreRuleId) {
              <lw-badge label="Overrides Core" tone="gold" />
            }
          </div>
          <div class="ab-rule-card__meta">
            <span
              class="ab-rule-card__source"
              [class.ab-rule-card__source--gold]="rule.isCustomizedForCampaign"
              [class.ab-rule-card__source--muted]="!!rule.bypassedByRuleId"
            >
              @if (rule.isCustomizedForCampaign) {
                {{ rule.bypassesCoreRuleId ? 'Campaign Bypass' : 'Campaign Custom' }}
              } @else if (rule.bypassedByRuleId) {
                Core SQL (Bypassed)
              } @else {
                Core SQL
              }
            </span>
            <span class="ab-rule-card__sep">·</span>
            <span class="ab-rule-card__cost">{{ rule.actionCost }}</span>
          </div>
        </div>
      </button>
    } @empty {
      <div class="ab-sidebar__empty">
        <p>No abilities match your search filter.</p>
      </div>
    }
  </div>
</aside>
