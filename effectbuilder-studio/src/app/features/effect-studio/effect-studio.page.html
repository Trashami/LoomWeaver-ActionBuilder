<div class="lw-fx-studio-shell">
  <!-- 1. Core LoomWeaver Top Header Bar (Links to loom-weaver.com/dashboard + Campaign/Character/Spell Push) -->
  <lw-effect-top-navbar
    [campaigns]="studio.campaigns()"
    [activeCampaignId]="studio.activeCampaignId()"
    [viewerRole]="studio.viewerRole()"
    [characters]="studio.authorizedCharacters()"
    [selectedCharacterKey]="studio.selectedCharacterKey()"
    [selectedSpellName]="studio.selectedSpellName()"
    [activeEffectName]="studio.effectName()"
    [assignments]="studio.campaignAssignments()"
    [isPushing]="studio.isPushingToCampaign()"
    [userDisplayName]="auth.isAuthenticated() ? auth.activeProfile().displayName : 'Jason (GeoJason)'"
    [userInitials]="auth.isAuthenticated() ? auth.activeProfile().displayName.slice(0, 2).toUpperCase() : 'JA'"
    (campaignChanged)="studio.setCampaign($event)"
    (viewerRoleToggled)="studio.setViewerRole($event)"
    (characterChanged)="studio.selectCharacter($event)"
    (spellChanged)="studio.selectSpell($event)"
    (pushToCampaignPressed)="studio.pushToCurrentCampaign()" />

  <!-- 2. Effect Sub-Header Bar (Back, Title, Design/Preview/In-Game Test, Undo/Redo, Save, Export) -->
  <lw-effect-sub-header
    [effectName]="studio.effectName()"
    [effectSubtitle]="studio.effectSubtitle()"
    [statusLabel]="studio.statusLabel()"
    [activeMode]="studio.activeMode()"
    [canUndo]="studio.canUndo()"
    [canRedo]="studio.canRedo()"
    (nameChanged)="studio.effectName.set($event)"
    (modeChanged)="onModeChanged($event)"
    (undoRequested)="studio.undo()"
    (redoRequested)="studio.redo()"
    (saveRequested)="studio.saveEffectDocument(studio.viewerRole())"
    (exportRequested)="studio.exportEffectJson()"
    (backRequested)="onNavigateBack()" />

  @if (studio.toastBanner(); as toast) {
    <div class="lw-fx-toast" role="status" aria-live="polite">
      {{ toast }}
    </div>
  }

  <!-- 3. Main 4-Column Studio Workspace -->
  <main class="lw-fx-workspace">
    <!-- Far-Left Vertical Icon Rail -->
    <lw-effect-tool-rail
      [activeTool]="studio.activeRailTool()"
      (toolSelected)="studio.selectRailTool($event)" />

    <!-- Left 3-Tab Library Drawer (Effects | Appearances | Presets) -->
    <lw-emitter-library-panel
      [activeSection]="studio.activeLibrarySection()"
      [emitters]="studio.filteredEmitters()"
      [appearances]="studio.appearances()"
      [presets]="studio.presets()"
      [activeEmitterId]="studio.activeEmitterId()"
      [activeAppearanceId]="studio.activeAppearanceId()"
      [activePresetId]="studio.activePresetId()"
      [searchQuery]="studio.librarySearch()"
      [selectedCategory]="studio.libraryCategory()"
      [categories]="studio.categories()"
      (sectionChanged)="studio.activeLibrarySection.set($event)"
      (searchChanged)="studio.librarySearch.set($event)"
      (categoryChanged)="studio.libraryCategory.set($event)"
      (emitterSelected)="onEmitterSelected($event)"
      (appearanceSelected)="onAppearanceSelected($event)"
      (presetSelected)="onPresetSelected($event)" />

    <!-- Center 3D Dungeon Stage + Bottom Multi-Track Timeline -->
    <div class="lw-fx-center-column">
      <lw-effect-viewport-stage
        [activeProperties]="studio.activeProperties()"
        [motionAndForces]="studio.motionAndForces()"
        [tracks]="studio.tracks()"
        [cameraPreset]="studio.activeCameraPreset()"
        [activeGizmo]="studio.activeGizmoTool()"
        [isPlaying]="studio.isPlaying()"
        [playheadSeconds]="studio.playheadSeconds()"
        [totalDurationSeconds]="studio.totalDurationSeconds()"
        [reducedMotion]="studio.reducedMotion()"
        [testResult]="studio.lastInGameTestResult()"
        (cameraPresetChanged)="studio.activeCameraPreset.set($event)"
        (gizmoSelected)="studio.activeGizmoTool.set($event)"
        (playheadUpdated)="studio.playheadSeconds.set($event)"
        (addLayerRequested)="studio.addTimelineLayer()"
        (duplicateLayerRequested)="studio.duplicateSelectedLayer()" />

      <lw-effect-timeline-dock
        [tracks]="studio.tracks()"
        [selectedTrackId]="studio.selectedTrackId()"
        [isPlaying]="studio.isPlaying()"
        [playheadSeconds]="studio.playheadSeconds()"
        [totalDurationSeconds]="studio.totalDurationSeconds()"
        (playToggled)="studio.isPlaying.set(!studio.isPlaying())"
        (playheadScrubbed)="studio.playheadSeconds.set($event)"
        (trackSelected)="studio.selectedTrackId.set($event)"
        (trackVisibilityToggled)="studio.toggleTrackVisibility($event)"
        (trackExpandedToggled)="studio.toggleTrackExpanded($event)" />
    </div>

    <!-- Right Properties, Layers & Modifiers Inspector -->
    <lw-effect-properties-inspector
      [activeTab]="studio.activeInspectorTab()"
      [properties]="studio.activeProperties()"
      [motionForces]="studio.motionAndForces()"
      [tracks]="studio.tracks()"
      [selectedTrackId]="studio.selectedTrackId()"
      (tabChanged)="studio.activeInspectorTab.set($event)"
      (propertiesPatched)="studio.patchProperties($event)"
      (motionPatched)="studio.patchMotionForces($event)"
      (trackPatched)="studio.patchTrack($event)"
      (trackVisibilityToggled)="studio.toggleTrackVisibility($event)"
      (addLayerRequested)="studio.addTimelineLayer()" />
  </main>

  <lw-auth-modal />
</div>
