<label class="search"><mw-icon name="search" /><input type="search" aria-label="Search layer options" placeholder="Search layers, styles, or spells..." [value]="query()" (input)="query.set($any($event.target).value)" /></label>
<div class="categories" role="group" aria-label="Layer categories">@for(group of categories();track group){<button type="button" [attr.aria-pressed]="category()===group" (click)="category.set(group)">{{group}} <span>{{count(group)}}</span></button>}</div>
<p class="count" role="status">{{filtered().length}} options</p>
<div class="options">@for(option of filtered();track option.id){<button type="button" class="option" [disabled]="option.disabled" [attr.title]="option.disabledReason || null" (click)="chosen.emit(option.id)"><mw-icon [name]="option.icon" /><strong>{{option.title}}</strong><small>{{option.description}}</small>@if(option.disabled){<small class="reason">{{option.disabledReason}}</small>}</button>}@empty{<p class="empty">No matching options. Try another search or category.</p>}</div>
