<aside class="lw-fx-rail" aria-label="Effect Builder Tool Rail">
  <div class="lw-fx-rail__list">
    @for (tool of tools(); track tool.id) {
      <button
        ngpButton
        type="button"
        class="lw-fx-rail__btn"
        [class.lw-fx-rail__btn--active]="activeTool() === tool.id"
        (click)="toolSelected.emit(tool.id)">
        <lw-icon [name]="tool.icon" [size]="18" />
        <span>{{ tool.label }}</span>
      </button>
    }
  </div>
</aside>
