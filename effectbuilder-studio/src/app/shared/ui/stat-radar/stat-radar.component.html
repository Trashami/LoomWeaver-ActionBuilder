<div class="lw-radar">
  @if (title()) {
    <div class="lw-radar__header">
      <h4 class="lw-radar__title">{{ title() }}</h4>
      @if (subtitle()) {
        <span class="lw-radar__subtitle">{{ subtitle() }}</span>
      }
    </div>
  }
  <div class="lw-radar__content">
    <svg class="lw-radar__svg" viewBox="0 0 220 220" aria-label="Character Radar Chart">
      <circle cx="110" cy="110" r="72" class="lw-radar__ring" />
      <circle cx="110" cy="110" r="48" class="lw-radar__ring" />
      <circle cx="110" cy="110" r="24" class="lw-radar__ring" />
      <polygon [attr.points]="polygonPoints()" class="lw-radar__shape" />
      @for (pt of axisLabels(); track pt.label) {
        <text [attr.x]="pt.x" [attr.y]="pt.y" text-anchor="middle" dominant-baseline="middle" class="lw-radar__label">
          {{ pt.label }}
        </text>
      }
    </svg>
    <div class="lw-radar__bars">
      @for (axis of axes(); track axis.label) {
        <div class="lw-radar__bar-row">
          <div class="lw-radar__bar-meta">
            <span>{{ axis.label }}</span>
            <strong>{{ axis.value }}%</strong>
          </div>
          <div class="lw-radar__bar-track">
            <div class="lw-radar__bar-fill" [style.width.%]="axis.value"></div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
