<section class="lw-fx-viewport" aria-label="2D and 3D Effect Stage">
  <div #viewportFrame class="lw-fx-viewport__frame">
    <canvas
      #stageCanvas
      class="lw-fx-viewport__canvas"
      aria-label="Babylon.js Real-Time 2D and 3D Effect Stage"></canvas>

    <!-- Top Surface & View Mode Bar (2D Top-Down vs 3D Mode + Legacy Surface Controls) -->
    <div class="lw-fx-viewport__topbar" role="toolbar" aria-label="Viewport Mode and Surface Controls">
      <div class="lw-fx-viewport__mode-group" role="group" aria-label="2D or 3D View Switcher">
        <button
          ngpButton
          type="button"
          class="lw-fx-mode-btn"
          [class.lw-fx-mode-btn--active]="viewDimensionMode() === '2d'"
          (click)="setDimension('2d')">
          2D Top-Down
        </button>
        <button
          ngpButton
          type="button"
          class="lw-fx-mode-btn"
          [class.lw-fx-mode-btn--active]="viewDimensionMode() === '3d'"
          (click)="setDimension('3d')">
          3D View
        </button>
      </div>

      @if (viewDimensionMode() === '3d') {
        <select
          class="lw-fx-camera-select"
          aria-label="Camera View Preset"
          [ngModel]="cameraPreset()"
          (ngModelChange)="cameraPresetChanged.emit($event)">
          @for (cam of cameraPresets; track cam) {
            <option [value]="cam">{{ cam }}</option>
          }
        </select>
      }

      <div class="lw-fx-viewport__surface-controls">
        <label class="lw-fx-surface-chk">
          <input
            type="checkbox"
            [ngModel]="stoneSample()"
            (ngModelChange)="toggleStoneSample($event)" />
          <span>Stone</span>
        </label>
        <label class="lw-fx-surface-chk">
          <input
            type="checkbox"
            [ngModel]="gridVisible()"
            (ngModelChange)="toggleGrid($event)" />
          <span>Grid</span>
        </label>
        <label class="lw-fx-surface-chk">
          <input
            type="checkbox"
            [ngModel]="movingTarget()"
            (ngModelChange)="toggleMovingTarget($event)" />
          <span>Moving Target</span>
        </label>
        <label class="lw-fx-surface-slider" title="Ambient Lighting">
          <span>Ambient</span>
          <input
            type="range"
            min="0"
            max="1.2"
            step="0.05"
            [ngModel]="ambientIntensity()"
            (ngModelChange)="updateAmbient(+$event)" />
        </label>
        <label class="lw-fx-surface-slider" title="Normal Bump Depth">
          <span>Bump</span>
          <input
            type="range"
            min="0"
            max="2.5"
            step="0.1"
            [ngModel]="bumpStrength()"
            (ngModelChange)="updateBump(+$event)" />
        </label>
      </div>

      <div class="lw-fx-viewport__actions">
        <button
          ngpButton
          type="button"
          class="lw-fx-stage-btn"
          aria-label="Zoom Out Stage"
          (click)="zoomStep('out')">
          -
        </button>
        <button
          ngpButton
          type="button"
          class="lw-fx-stage-btn"
          aria-label="Zoom In Stage"
          (click)="zoomStep('in')">
          +
        </button>
        <button
          ngpButton
          type="button"
          class="lw-fx-stage-btn"
          (click)="resetCamera()">
          Reset View
        </button>
        <button
          ngpButton
          type="button"
          class="lw-fx-stage-btn lw-fx-stage-btn--gold"
          (click)="replayCurrentComposition()">
          <lw-icon name="play" [size]="12" />
          <span>Cast Effect</span>
        </button>
      </div>
    </div>

    @if (testResult(); as res) {
      <div class="lw-fx-viewport__test-pill">
        <span>{{ res.combatLogSummary }}</span>
      </div>
    }

    <!-- Bottom-Right Orientation Compass -->
    <div class="lw-fx-viewport__compass" aria-hidden="true">
      <svg viewBox="0 0 64 64" class="lw-fx-axis-svg">
        <circle cx="32" cy="32" r="29" fill="rgba(7, 15, 12, 0.78)" stroke="rgba(148, 178, 162, 0.35)" stroke-width="1.5" />
        <line x1="32" y1="32" x2="32" y2="10" stroke="#4ade80" stroke-width="2" />
        <polygon points="32,6 28,13 36,13" fill="#4ade80" />
        <line x1="32" y1="32" x2="52" y2="38" stroke="#f87171" stroke-width="2" />
        <polygon points="56,39 49,34 50,41" fill="#f87171" />
        <line x1="32" y1="32" x2="14" y2="42" stroke="#38bdf8" stroke-width="2" />
        <polygon points="10,44 18,43 15,37" fill="#38bdf8" />
        <circle cx="32" cy="32" r="3" fill="#f8fafc" />
      </svg>
    </div>
  </div>
</section>
