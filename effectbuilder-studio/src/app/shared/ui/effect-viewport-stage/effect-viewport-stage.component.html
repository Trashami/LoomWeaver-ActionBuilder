<section class="lw-fx-viewport" aria-label="3D Dungeon Effect Stage">
  <div class="lw-fx-viewport__frame">
    <canvas
      #stageCanvas
      class="lw-fx-viewport__canvas"
      aria-label="Babylon.js Real-Time 3D Dungeon and Rune Vortex Stage"></canvas>

    <!-- Top-Left Transform & Gizmo Toolbar -->
    <div class="lw-fx-viewport__gizmos" role="toolbar" aria-label="3D Transform Controls">
      @for (tool of gizmoTools; track tool.id) {
        <button
          ngpButton
          type="button"
          class="lw-fx-gizmo-btn"
          [class.lw-fx-gizmo-btn--active]="activeGizmo() === tool.id"
          [attr.aria-label]="tool.label"
          (click)="gizmoSelected.emit(tool.id)">
          <lw-icon [name]="tool.icon" [size]="15" />
        </button>
      }
    </div>

    <!-- Top-Right Camera Preset Dropdown -->
    <div class="lw-fx-viewport__camera">
      <select
        class="lw-fx-camera-select"
        aria-label="Camera View Preset"
        [ngModel]="cameraPreset()"
        (ngModelChange)="cameraPresetChanged.emit($event)">
        @for (cam of cameraPresets; track cam) {
          <option [value]="cam">Camera: {{ cam }}</option>
        }
      </select>
    </div>

    @if (testResult(); as res) {
      <div class="lw-fx-viewport__test-pill">
        <span>{{ res.combatLogSummary }}</span>
      </div>
    }

    <!-- Bottom-Right 3D XYZ Orientation Axis Compass & Grid Button -->
    <div class="lw-fx-viewport__compass" aria-hidden="true">
      <svg viewBox="0 0 64 64" class="lw-fx-axis-svg">
        <circle cx="32" cy="32" r="29" fill="rgba(7, 15, 12, 0.78)" stroke="rgba(148, 178, 162, 0.35)" stroke-width="1.5" />
        <!-- Y Axis (Green Up) -->
        <line x1="32" y1="32" x2="32" y2="10" stroke="#4ade80" stroke-width="2" />
        <polygon points="32,6 28,13 36,13" fill="#4ade80" />
        <!-- X Axis (Red Right) -->
        <line x1="32" y1="32" x2="52" y2="38" stroke="#f87171" stroke-width="2" />
        <polygon points="56,39 49,34 50,41" fill="#f87171" />
        <!-- Z Axis (Blue Left/Forward) -->
        <line x1="32" y1="32" x2="14" y2="42" stroke="#38bdf8" stroke-width="2" />
        <polygon points="10,44 18,43 15,37" fill="#38bdf8" />
        <circle cx="32" cy="32" r="3" fill="#f8fafc" />
      </svg>
      <button
        ngpButton
        type="button"
        class="lw-fx-grid-mini-btn"
        aria-label="Toggle Viewport Grid"
        (click)="gizmoSelected.emit('grid')">
        <lw-icon name="grid" [size]="13" />
      </button>
    </div>
  </div>

  <!-- Sub-Viewport Timeline Header Action Bar -->
  <div class="lw-fx-viewport__subbar">
    <div class="lw-fx-viewport__subbar-left">
      <lw-icon name="maximize" [size]="14" />
      <span>Timeline</span>
    </div>
    <div class="lw-fx-viewport__subbar-right">
      <button
        ngpButton
        type="button"
        class="lw-fx-subbar-btn"
        (click)="addLayerRequested.emit()">
        <lw-icon name="plus" [size]="14" />
        <span>Add Layer</span>
      </button>
      <button
        ngpButton
        type="button"
        class="lw-fx-subbar-btn"
        (click)="duplicateLayerRequested.emit()">
        <lw-icon name="copy" [size]="14" />
        <span>Duplicate</span>
      </button>
    </div>
  </div>
</section>
