<header class="lw-fx-topnav" role="banner">
  <div class="lw-fx-topnav__left">
    <a class="lw-fx-brand" href="https://loom-weaver.com">
      <span class="lw-fx-brand__crest" aria-hidden="true">
        <span class="lw-fx-brand__ring"></span>
      </span>
      <span class="lw-fx-brand__wordmark">{{ brandTitle() }}</span>
    </a>

    <nav class="lw-fx-navlinks" aria-label="LoomWeaver Platform Navigation">
      @for (item of navItems(); track item.id) {
        <a
          class="lw-fx-navlink"
          [class.lw-fx-navlink--active]="item.active"
          [href]="item.href">
          <lw-icon [name]="item.icon" [size]="15" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>

  <div class="lw-fx-topnav__right">
    <label class="lw-fx-global-search" aria-label="Search assets, spells, or effects">
      <lw-icon name="search" [size]="15" />
      <input
        type="search"
        [placeholder]="searchPlaceholder()"
        [ngModel]="searchQuery()"
        (ngModelChange)="searchChanged.emit($event)" />
    </label>

    <button
      ngpButton
      type="button"
      class="lw-fx-icon-btn"
      aria-label="Notifications">
      <lw-icon name="bell" [size]="17" />
    </button>

    <button
      ngpButton
      type="button"
      class="lw-fx-icon-btn"
      aria-label="Help Documentation">
      <lw-icon name="help" [size]="17" />
    </button>

    <button
      ngpButton
      type="button"
      class="lw-fx-icon-btn"
      aria-label="Studio Settings"
      (click)="settingsPressed.emit()">
      <lw-icon name="settings" [size]="17" />
    </button>

    <button
      ngpButton
      type="button"
      class="lw-fx-avatar-btn"
      aria-label="Account Profile"
      (click)="accountPressed.emit()">
      {{ userInitials() }}
    </button>
  </div>
</header>
