<header class="lw-topbar" role="banner">
  <div class="lw-topbar__left">
    <a
      class="lw-topbar__brand"
      href="https://loom-weaver.com/dashboard"
      title="Return to LoomWeaver Dashboard">
      <img src="/LoomWeaver.png" alt="LoomWeaver Crest" class="lw-topbar__logo" />
      <div class="lw-topbar__titles">
        <span class="lw-topbar__name">LOOMWEAVER</span>
        <span class="lw-topbar__tag">Your Campaign. One Living World.</span>
      </div>
    </a>

    <div class="lw-topbar__divider"></div>

    <div class="lw-campaign-picker">
      <div class="lw-campaign-picker__body">
        <div class="lw-campaign-picker__row">
          <select
            class="lw-campaign-picker__select"
            [ngModel]="activeCampaignId()"
            (ngModelChange)="campaignChanged.emit(+$event)"
            aria-label="Active Campaign">
            @for (camp of campaigns(); track camp.id) {
              <option [ngValue]="camp.id">{{ camp.name.toUpperCase() }}</option>
            }
          </select>
        </div>
        <span class="lw-campaign-picker__sub">
          Campaign · {{ activeCampaign().currentSessionNumber }} sessions · High Fantasy
        </span>
      </div>
    </div>
  </div>

  <div class="lw-topbar__right">
    <div class="lw-campaign-push-bar" aria-label="Campaign Character & Spell Effect Assignment">
      <button
        ngpButton
        type="button"
        class="lw-campaign-push-bar__role"
        [class.lw-campaign-push-bar__role--player]="viewerRole() !== 'gm'"
        (click)="toggleRole()"
        title="Switch between Dungeon Master (all campaign characters) and Player (own character) scope">
        <span class="lw-campaign-push-bar__role-dot"></span>
        <span>{{ viewerRole() === 'gm' ? 'DM Mode' : 'Player Mode' }}</span>
      </button>

      <label class="lw-campaign-push-bar__field">
        <span class="lw-campaign-push-bar__label">Character</span>
        <select
          class="lw-campaign-push-bar__select"
          aria-label="Select Character for Effect"
          [ngModel]="selectedCharacterKey()"
          (ngModelChange)="characterChanged.emit($event)">
          @for (ch of characters(); track ch.characterKey) {
            <option [value]="ch.characterKey">
              {{ ch.name }} ({{ ch.classOrTitle }})
            </option>
          }
        </select>
      </label>

      <label class="lw-campaign-push-bar__field">
        <span class="lw-campaign-push-bar__label">Spell / Action</span>
        <select
          class="lw-campaign-push-bar__select"
          aria-label="Select Spell for Effect"
          [ngModel]="selectedSpellName()"
          (ngModelChange)="spellChanged.emit($event)">
          @for (spell of availableSpells(); track spell) {
            <option [value]="spell">{{ spell }}</option>
          }
        </select>
      </label>

      <button
        ngpButton
        type="button"
        class="lw-campaign-push-bar__btn"
        [disabled]="isPushing()"
        (click)="pushToCampaignPressed.emit()"
        title="Save & assign current 3D effect to the selected character and spell in MySQL for this campaign">
        <span>{{ isPushing() ? 'Pushing...' : 'Push to Campaign' }}</span>
      </button>
    </div>

    <div class="lw-profile-pill">
      <div class="lw-profile-pill__avatar">
        <span>{{ userInitials() }}</span>
      </div>
      <div class="lw-profile-pill__info">
        <strong>{{ userDisplayName() }}</strong>
        <span>{{ viewerRole() === 'gm' ? 'Dungeon Master' : 'Adventurer' }}</span>
      </div>
    </div>
  </div>
</header>
